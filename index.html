<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>BIENVIVOS</title>
    <meta
      name="description"
      content="BIENVIVOS is an independent magazine exploring culture, ideas, people, and modern life."
    />

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Arial, Helvetica, sans-serif;
        background: #f5f2ea;
        color: #161616;
      }

      main {
        max-width: 760px;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(3rem, 12vw, 8rem);
        letter-spacing: -0.06em;
      }

      p {
        margin: 24px auto 0;
        max-width: 560px;
        font-size: 1.1rem;
        line-height: 1.6;
      }

      .status {
        margin-top: 32px;
        font-size: 0.8rem;
        font-weight: bold;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
    </style>
  </head>

  <body>
    <main>
      <h1>BIENVIVOS</h1>

      <p>
        An independent magazine exploring culture, ideas, people, and modern
        life.
      </p>

      <div class="status">Coming soon</div>
    </main>
  </body>
</html>
